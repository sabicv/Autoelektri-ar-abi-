<!doctype html>
<html lang="hr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070a0d" />
    <title>Nema veze — Radionica</title>
    <!-- Shown by the service worker (public/sw.js) only when a page can't be
         loaded at all; kept self-contained so it works with no network. -->
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        display: flex; align-items: center; justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        box-sizing: border-box;
        background: #070a0d; color: #e2e8f0;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center;
      }
      .mark { width: 64px; height: 64px; border-radius: 16px; background: #2563eb; display: inline-flex; align-items: center; justify-content: center; }
      h1 { font-size: 20px; margin: 20px 0 8px; }
      p { margin: 0 0 24px; color: #94a3b8; font-size: 15px; line-height: 1.5; }
      button {
        min-height: 52px; padding: 0 28px; border: 0; border-radius: 12px;
        background: #0ea5ff; color: #070a0d; font-size: 16px; font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="mark">
        <svg width="36" height="36" viewBox="0 0 96 96" aria-hidden="true"><path d="M53 16 30 52h16l-5 28 25-38H50z" fill="#fff" /></svg>
      </span>
      <h1>Nema internetske veze</h1>
      <p>Provjeri Wi-Fi ili mobilne podatke.<br />Ništa od upisanog nije izgubljeno.</p>
      <button type="button" onclick="location.reload()">Pokušaj ponovno</button>
    </main>
    <script>
      // Back online → straight back to the page that failed.
      window.addEventListener('online', function () { location.reload(); });
    </script>
  </body>
</html>
